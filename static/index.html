<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free RAG Project</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --accent: #2f6b4f;
    --accent-dark: #1f4d38;
    --text: #1f2328;
    --muted: #6b7280;
    --border: #e4e2dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 18px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }

  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  .sidebar {
    width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
  }
  .sidebar h2 { font-size: 0.95rem; margin-top: 0; }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .dropzone:hover { border-color: var(--accent); color: var(--accent); }
  #fileInput { display: none; }
  .status { font-size: 0.8rem; color: var(--muted); margin-bottom: 16px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  button:hover { background: var(--accent-dark); }
  button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }

  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .msg { max-width: 70%; margin-bottom: 16px; padding: 12px 16px; border-radius: 10px; line-height: 1.45; font-size: 0.92rem; }
  .msg.user { background: var(--accent); color: white; margin-left: auto; }
  .msg.bot { background: var(--panel); border: 1px solid var(--border); }
  .sources { margin-top: 8px; font-size: 0.78rem; color: var(--muted); }
  .sources details { cursor: pointer; }

  .input-row {
    display: flex;
    gap: 10px;
    padding: 16px 24px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  .input-row input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .file-list { list-style: none; padding: 0; margin: 0; font-size: 0.82rem; }
  .file-list li { padding: 4px 0; color: var(--text); border-bottom: 1px solid var(--border); }
  .badge { display: inline-block; background: #eaf3ee; color: var(--accent-dark); font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
</style>
</head>
<body>

<header>
  <h1>📚 Free RAG Project — Document Q&amp;A <span class="badge">$0 cost</span></h1>
  <p>Local embeddings (fastembed) + local vector store (ChromaDB) + free Groq API for answers.</p>
</header>

<div class="layout">
  <div class="sidebar">
    <h2>Documents</h2>
    <div class="dropzone" id="dropzone">Click or drag a .txt / .pdf file here</div>
    <input type="file" id="fileInput" accept=".txt,.pdf,.md">
    <div class="status" id="status">No documents indexed yet.</div>
    <ul class="file-list" id="fileList"></ul>
    <button class="secondary" onclick="resetIndex()">Clear all documents</button>
  </div>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="msg bot">Hi! Upload a document on the left, then ask me anything about it.</div>
    </div>
    <div class="input-row">
      <input type="text" id="queryInput" placeholder="Ask a question about your documents..." onkeydown="if(event.key==='Enter') sendQuery()">
      <button onclick="sendQuery()">Ask</button>
    </div>
  </div>
</div>

<script>
const API_BASE = "";

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const statusEl = document.getElementById("status");
const fileListEl = document.getElementById("fileList");
const messagesEl = document.getElementById("messages");

dropzone.onclick = () => fileInput.click();
dropzone.ondragover = (e) => { e.preventDefault(); dropzone.style.borderColor = "var(--accent)"; };
dropzone.ondragleave = () => { dropzone.style.borderColor = "var(--border)"; };
dropzone.ondrop = (e) => {
  e.preventDefault();
  dropzone.style.borderColor = "var(--border)";
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
};
fileInput.onchange = () => {
  if (fileInput.files.length) uploadFile(fileInput.files[0]);
};

async function uploadFile(file) {
  statusEl.textContent = `Uploading ${file.name}...`;
  const formData = new FormData();
  formData.append("file", file);
  try {
    const res = await fetch(`${API_BASE}/upload`, { method: "POST", body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Upload failed");
    statusEl.textContent = `Index has ${data.total_chunks_in_index} chunks total.`;
    const li = document.createElement("li");
    li.textContent = `${file.name} (${data.chunks_added} chunks)`;
    fileListEl.appendChild(li);
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
  }
}

async function resetIndex() {
  await fetch(`${API_BASE}/reset`, { method: "POST" });
  fileListEl.innerHTML = "";
  statusEl.textContent = "Index cleared.";
}

function addMessage(text, cls, sources) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.textContent = text;
  if (sources && sources.length) {
    const det = document.createElement("details");
    det.className = "sources";
    const sum = document.createElement("summary");
    sum.textContent = `Sources (${sources.length})`;
    det.appendChild(sum);
    sources.forEach(s => {
      const p = document.createElement("div");
      p.textContent = `${s.source} · score ${s.score}: "${s.preview}..."`;
      det.appendChild(p);
    });
    div.appendChild(det);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendQuery() {
  const input = document.getElementById("queryInput");
  const query = input.value.trim();
  if (!query) return;
  addMessage(query, "user");
  input.value = "";

  const thinking = document.createElement("div");
  thinking.className = "msg bot";
  thinking.textContent = "Thinking...";
  messagesEl.appendChild(thinking);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch(`${API_BASE}/query`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, top_k: 4 }),
    });
    const data = await res.json();
    thinking.remove();
    addMessage(data.answer, "bot", data.sources);
  } catch (err) {
    thinking.remove();
    addMessage(`Error: ${err.message}`, "bot");
  }
}
</script>

</body>
</html>
